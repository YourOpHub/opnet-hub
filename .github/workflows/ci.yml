name: CI
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Security audit (non-blocking)
        run: npm audit --audit-level=high || true

      - run: npx tsc --noEmit
      - run: npx eslint src/ --quiet --max-warnings=0
      - name: Tests with coverage (thresholds enforced via vitest config)
        run: npx vitest run --coverage

      - run: npm run build
