# /etc/nginx/sites-available/opnet-hub
# ln -s /etc/nginx/sites-available/opnet-hub /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name 188.137.250.160;
    # Replace with your domain when ready:
    # server_name opnethub.xyz;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API proxy to Node.js backend
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:4000/health;
        proxy_set_header Host $host;
    }

    # Static frontend (optional — if serving from VPS instead of gh-pages)
    # location / {
    #     root /var/www/opnet-hub;
    #     try_files $uri $uri/ /index.html;
    #     expires 1d;
    #     add_header Cache-Control "public, immutable";
    # }
}
